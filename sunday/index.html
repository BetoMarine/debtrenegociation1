<!doctype html>
<html lang="en" data-pyl-app="sunday">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* pyl-shell-guard */
      (function () {
        var expected = document.documentElement.getAttribute("data-pyl-app");
        var path = location.pathname || "";
        var app = /\/fortune(?:\/|$)/.test(path) ? "fortune" : /\/sunday(?:\/|$)/.test(path) ? "sunday" : "right-door";
        if (expected === app) return;
        document.documentElement.style.visibility = "hidden";
        function go() {
          location.reload();
        }
        if (!("serviceWorker" in navigator)) {
          go();
          return;
        }
        navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) { return r.unregister(); }));
        }).then(function () {
          if (!self.caches || !caches.keys) return;
          return caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          });
        }).then(go, go);
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fafafa" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sunday Pack" />
    <meta
      name="description"
      content="Prepare a 1-page counsellor briefing on this phone. You bring it. We never email Enrich, banks, or lenders."
    />
    <title>Sunday Pack</title>
    <link rel="manifest" href="/sunday/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/sunday/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/sunday/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/sunday/main.js"></script>
  </body>
</html>
