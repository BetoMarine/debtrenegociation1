name: Pages preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: pages-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish PR preview under preview/pr-N
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: preview/pr-${{ github.event.number }}
          keep_files: true
          enable_jekyll: false
      - name: Preview URL
        run: |
          echo "https://betomarine.github.io/debtrenegociation1/preview/pr-${{ github.event.number }}/fortune/"
          echo "Cold-load (bypasses live SW nav): https://betomarine.github.io/debtrenegociation1/preview/pr-${{ github.event.number }}/fortune/index.html"
