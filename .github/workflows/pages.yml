name: GitHub Pages

# Pushes to main used to build the app and publish dist onto gh-pages.
# That publish deletes files already on gh-pages, then copies the build
# over the branch. Live Fortune, live Right Door, and the preview pages
# live only on gh-pages, so a publish swaps the two live bundles and
# removes the previews.
#
# This workflow still checks main. It does not publish. GitHub Pages
# keeps serving the gh-pages branch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
